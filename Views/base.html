<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=shopping_cart,person" />
  <title>Writophony – Partie</title>
  <link rel="stylesheet" type="text/css" href="/css/style.css" />
</head>

<body>

  <header class="topbar">
    <a class="brand" href="/">
      <img src="/assets/logo.png" alt="Logo">
      <span>Writophony</span>
    </a>

    <nav class="actions" aria-label="Navigation principale">
      <button class="btn" type="button" id="open-shop" aria-haspopup="dialog">
        <span class="material-symbols-outlined">shopping_cart</span>
        <span>Boutique</span>
      </button>

      <button class="btn" type="button" id="open-profile" aria-haspopup="dialog">
        <span class="material-symbols-outlined">person</span>
        <span>Profil</span>
      </button>

      <button class="avatar" type="button" aria-label="Compte utilisateur">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </button>
    </nav>
  </header>

  <!-- Popup Boutique (exemple statique) -->
  <div class="modal-overlay" id="shop-overlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="shop-title">
      <div class="modal-head">
        <div class="shop-balance"><span class="coin" aria-hidden="true"></span><strong>-</strong><span>pièces d'or</span></div>
        <h2 class="modal-title" id="shop-title">Boutique</h2>
        <button class="modal-close" type="button" data-close aria-label="Fermer la boutique"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="shop-grid">
        <article class="shop-item">
          <div class="shop-thumb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg></div>
          <h3 class="shop-name">Name</h3>
          <div class="shop-price"><span class="coin" aria-hidden="true"></span>-</div>
          <button class="shop-btn" type="button">Acheter</button>
        </article>
      </div>
    </div>
  </div>

  <!-- Popup Profil (exemple statique) -->
  <div class="modal-overlay" id="profile-overlay" aria-hidden="true">
    <div class="modal modal--profile" role="dialog" aria-modal="true" aria-labelledby="profile-title">
      <div class="modal-head">
        <div class="shop-balance"><span class="coin" aria-hidden="true"></span><strong>-</strong><span>pièces d'or</span></div>
        <h2 class="modal-title" id="profile-title">Profil</h2>
        <button class="modal-close" type="button" data-close aria-label="Fermer le profil"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>

      <section class="profile-card" aria-label="Identité">
        <div class="profile-banner is-starry"></div>
        <div class="profile-identity">
          <div class="profile-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
          <div class="profile-who">
            <div class="profile-name">Username</div>
          </div>
          <button class="btn btn--small btn--red" type="button">Se déconnecter</button>
        </div>
      </section>

      <div class="profile-stats">
        <div class="profile-stat"><strong>-</strong><span>Parties jouées</span></div>
        <div class="profile-stat"><strong>-</strong><span>Total de likes</span></div>
      </div>

      <div class="profile-section-head">
        <h3>Ma collection</h3>
        <button class="profile-link" type="button" id="profile-to-shop">Voir la boutique</button>
      </div>
      <div class="collection-grid">
        <!-- Inventaire de l'utilisateur-->
      </div>
    </div>
  </div>

  <!-- Seule logique de la page : ouvrir et fermer les popups -->
  <script>
    (function () {
      var shop = document.getElementById('shop-overlay');
      var profile = document.getElementById('profile-overlay');
      var openShop = document.getElementById('open-shop');
      var openProfile = document.getElementById('open-profile');
      var current = null;
      var lastTrigger = null;

      function open(overlay, trigger) {
        if (current) close(true);
        current = overlay;
        lastTrigger = trigger;
        overlay.classList.add('is-open');
        overlay.setAttribute('aria-hidden', 'false');
        overlay.querySelector('[data-close]').focus();
      }

      function close(silent) {
        if (!current) return;
        current.classList.remove('is-open');
        current.setAttribute('aria-hidden', 'true');
        current = null;
        if (!silent && lastTrigger) lastTrigger.focus();
      }

      openShop.addEventListener('click', function () { open(shop, openShop); });
      openProfile.addEventListener('click', function () { open(profile, openProfile); });
      document.getElementById('profile-to-shop').addEventListener('click', function () { open(shop, openProfile); });

      [shop, profile].forEach(function (overlay) {
        overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
        overlay.querySelector('[data-close]').addEventListener('click', function () { close(); });
      });

      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
    })();
  </script>

</body>

</html>
